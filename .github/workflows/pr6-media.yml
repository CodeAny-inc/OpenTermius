name: PR 6 review media
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pr6-media.yml']
permissions: {}
concurrency:
  group: pr6-media-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/persistent-terminal-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: CodeAny-inc/OpenTermius
    steps:
      - name: Install checksum-verified GitHub CLI with media support
        run: |
          curl --fail --location --silent --show-error https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/gh.tgz"
          echo 'e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be  '"$RUNNER_TEMP/gh.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Prepare and attach historical screenshots
        run: |
          gh run download 33985505947 --name terminal-workspace-ui-33985505947 --dir prior
          gh pr view 6 --json body,state > current.json
          python3 - <<'PY'
          import json, pathlib, subprocess
          current = json.loads(pathlib.Path('current.json').read_text())
          assert current['state'] == 'OPEN', 'PR no longer open'
          start, end = '<!-- pr6-original-media:start -->', '<!-- pr6-original-media:end -->'
          body = current['body']
          if start in body:
              body = body[:body.index(start)] + body[body.index(end)+len(end):]
          images = sorted(pathlib.Path('prior').rglob('*.png'))
          assert len(images) == 9, f'Expected nine original captures, got {len(images)}'
          section = '\n\n'+start+'\n<details>\n<summary>Original verification: all nine screenshots (before the UI simplification)</summary>\n\n'
          section += 'Historical evidence from revision `abd2ba68`, not the latest redesign. Actual browser captures with mocked Tauri SSH/SFTP IPC.\n\n'
          args = ['gh', 'pr', 'edit', '6', '--body-file', 'with-media.md']
          for image in images:
              section += f'### {image.stem}\n\n![{image.stem}]({image.as_posix()})\n\n'
              args += ['--attach', str(image)]
          section += '</details>\n'+end+'\n'
          pathlib.Path('with-media.md').write_text(body + section)
          subprocess.run(args, check=True)
          PY
      - name: Save published body for verification
        if: always()
        run: gh pr view 6 --json body > published-body.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr6-media-publication-${{ github.run_id }}
          retention-days: 14
          path: published-body.json
