name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and bundle Tauri app
        working-directory: desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenTermius ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release download "$TAG" --dir ./assets --clobber
          ls -la ./assets

      - name: Generate latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Collect platform-specific update entries from the .sig files
          # Tauri generates <artifact>.sig alongside each bundle
          # Build the latest.json manifest referencing the GitHub release assets
          
          # macOS arm64
          MACOS_ARM64_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/OpenTermius_${VERSION}_aarch64.app.tar.gz"
          MACOS_ARM64_SIG=""
          if [ -f "./assets/OpenTermius_${VERSION}_aarch64.app.tar.gz.sig" ]; then
            MACOS_ARM64_SIG=$(cat "./assets/OpenTermius_${VERSION}_aarch64.app.tar.gz.sig")
          fi
          
          # macOS x86_64
          MACOS_X64_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/OpenTermius_${VERSION}_x64.app.tar.gz"
          MACOS_X64_SIG=""
          if [ -f "./assets/OpenTermius_${VERSION}_x64.app.tar.gz.sig" ]; then
            MACOS_X64_SIG=$(cat "./assets/OpenTermius_${VERSION}_x64.app.tar.gz.sig")
          fi
          
          # Linux
          LINUX_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/opentermius-desktop_${VERSION}_amd64.AppImage"
          LINUX_SIG=""
          if [ -f "./assets/opentermius-desktop_${VERSION}_amd64.AppImage.sig" ]; then
            LINUX_SIG=$(cat "./assets/opentermius-desktop_${VERSION}_amd64.AppImage.sig")
          fi
          
          # Windows
          WINDOWS_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/OpenTermius_${VERSION}_x64-setup.exe"
          WINDOWS_SIG=""
          if [ -f "./assets/OpenTermius_${VERSION}_x64-setup.exe.sig" ]; then
            WINDOWS_SIG=$(cat "./assets/OpenTermius_${VERSION}_x64-setup.exe.sig")
          fi
          
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "OpenTermius ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_ARM64_SIG}",
                "url": "${MACOS_ARM64_URL}"
              },
              "darwin-x86_64": {
                "signature": "${MACOS_X64_SIG}",
                "url": "${MACOS_X64_URL}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${LINUX_URL}"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "${WINDOWS_URL}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release upload "$TAG" latest.json --clobber
